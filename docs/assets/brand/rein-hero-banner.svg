<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001838"/>
      <stop offset="50%" stop-color="#002868"/>
      <stop offset="100%" stop-color="#003D99"/>
    </linearGradient>

    <!-- Accent Glow -->
    <radialGradient id="glowTopRight" cx="85%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#0070BA" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0070BA" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowShield" cx="22%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#009CDE" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#001838" stop-opacity="0"/>
    </radialGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0070BA"/>
      <stop offset="100%" stop-color="#003087"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885"/>
      <stop offset="50%" stop-color="#FFC439"/>
      <stop offset="100%" stop-color="#E0A526"/>
    </linearGradient>

    <!-- Border Linear -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0070BA" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFC439" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#009CDE" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; font-weight: 800; font-size: 58px; fill: #FFFFFF; letter-spacing: -0.03em; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; font-weight: 600; font-size: 21px; fill: #38BDF8; letter-spacing: -0.01em; }
    .quote { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; font-weight: 400; font-style: italic; font-size: 16px; fill: #CBD5E1; }
    .chip-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #FFFFFF; }
    .mono-badge { font-family: 'IBM Plex Mono', monospace; font-size: 12px; fill: #FFC439; font-weight: 600; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="380" rx="20" fill="url(#bgGrad)"/>
  <rect width="1200" height="380" rx="20" fill="url(#glowTopRight)"/>
  <rect width="1200" height="380" rx="20" fill="url(#glowShield)"/>

  <!-- Subtle Blueprint Tech Grid -->
  <g opacity="0.07" stroke="#FFFFFF" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="380"/>
    <line x1="160" y1="0" x2="160" y2="380"/>
    <line x1="240" y1="0" x2="240" y2="380"/>
    <line x1="320" y1="0" x2="320" y2="380"/>
    <line x1="400" y1="0" x2="400" y2="380"/>
    <line x1="480" y1="0" x2="480" y2="380"/>
    <line x1="560" y1="0" x2="560" y2="380"/>
    <line x1="640" y1="0" x2="640" y2="380"/>
    <line x1="720" y1="0" x2="720" y2="380"/>
    <line x1="800" y1="0" x2="800" y2="380"/>
    <line x1="880" y1="0" x2="880" y2="380"/>
    <line x1="960" y1="0" x2="960" y2="380"/>
    <line x1="1040" y1="0" x2="1040" y2="380"/>
    <line x1="1120" y1="0" x2="1120" y2="380"/>

    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
  </g>

  <!-- Decorative Border Frame -->
  <rect x="1" y="1" width="1198" height="378" rx="19" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- LEFT: Hero Brand Shield Graphic -->
  <g transform="translate(90, 75)" filter="url(#cardShadow)">
    <!-- Outer Shield Halo Ring -->
    <path d="M110 10 L195 45 C195 135 155 195 110 225 C65 195 25 135 25 45 Z" 
          fill="none" stroke="#009CDE" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.6"/>

    <!-- Main Solid Shield -->
    <path d="M110 20 L185 52 C185 130 150 183 110 210 C70 183 35 130 35 52 Z" 
          fill="url(#shieldGrad)" stroke="#38BDF8" stroke-width="3"/>

    <!-- Inner Shield Inset Layer -->
    <path d="M110 36 L172 62 C172 125 142 168 110 190 C78 168 48 125 48 62 Z" 
          fill="#001838" opacity="0.45"/>

    <!-- PayPal Classic P Emblems Crossed with Mandate Lock -->
    <g transform="translate(72, 70)">
      <!-- Golden Mandate Gate Checkmark & Lock Loop -->
      <path d="M38 12 C25 12 15 22 15 35 L15 50 L61 50 L61 35 C61 22 51 12 38 12 Z" 
            fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
      <rect x="8" y="48" width="60" height="46" rx="8" fill="url(#goldGrad)"/>
      <circle cx="38" cy="68" r="5" fill="#001838"/>
      <path d="M38 73 L38 82" stroke="#001838" stroke-width="4" stroke-linecap="round"/>
      
      <!-- Verified Green Check Overlay -->
      <circle cx="62" cy="86" r="14" fill="#028760" stroke="#FFFFFF" stroke-width="2.5"/>
      <path d="M56 86 L60 90 L68 81" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- RIGHT: Typography & Product Information -->
  <g transform="translate(340, 80)">
    <!-- Category Pill -->
    <g transform="translate(0, 0)">
      <rect width="365" height="30" rx="15" fill="#00142C" stroke="#0070BA" stroke-width="1.5"/>
      <circle cx="16" cy="15" r="4.5" fill="#FFC439"/>
      <text x="30" y="20" class="mono-badge">BUILD WHAT'S NEXT WITH PAYPAL &amp; AI</text>
    </g>

    <!-- Product Title -->
    <text x="0" y="76" class="title">REIN <tspan fill="#FFC439" font-size="44px">🛡️</tspan></text>

    <!-- Subtitle -->
    <text x="0" y="112" class="subtitle">Deterministic Mandate Gate for Agentic PayPal Workflows</text>

    <!-- Impact Quote -->
    <text x="0" y="146" class="quote">“Give your AI agent a refund budget, not your PayPal keys.”</text>

    <!-- Feature Pill Badges -->
    <g transform="translate(0, 182)">
      <!-- Badge 1: 392 Tests Passing -->
      <g transform="translate(0, 0)">
        <rect width="180" height="36" rx="18" fill="rgba(2, 135, 96, 0.22)" stroke="#028760" stroke-width="1.5"/>
        <text x="16" y="23" class="chip-text">✅ 392 Tests Passing</text>
      </g>

      <!-- Badge 2: Dual SQLite Drivers -->
      <g transform="translate(192, 0)">
        <rect width="185" height="36" rx="18" fill="rgba(0, 112, 186, 0.22)" stroke="#0070BA" stroke-width="1.5"/>
        <text x="16" y="23" class="chip-text">⚡ Dual SQLite Drivers</text>
      </g>

      <!-- Badge 3: SHA-256 Chain + Ed25519 -->
      <g transform="translate(389, 0)">
        <rect width="210" height="36" rx="18" fill="rgba(255, 196, 57, 0.15)" stroke="#FFC439" stroke-width="1.5"/>
        <text x="16" y="23" class="chip-text">🔒 Ed25519 Signed Ledger</text>
      </g>

      <!-- Badge 4: Live on Render -->
      <g transform="translate(611, 0)">
        <rect width="160" height="36" rx="18" fill="rgba(56, 189, 248, 0.2)" stroke="#38BDF8" stroke-width="1.5"/>
        <text x="16" y="23" class="chip-text">🌐 Render Live</text>
      </g>
    </g>
  </g>
</svg>
